name: Keep the database awake

# Supabase pauses free projects after about a week without requests, which
# would switch off the Stats page, puzzle ratings and online games until the
# project is restored by hand. This asks it for one row every three days.
# If the project has been paused anyway, the request fails and GitHub emails
# the repository owner about the failed run.
#
# GitHub also switches off scheduled workflows in public repositories that
# have had no commits for 60 days, so each run switches this one back on.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # The same project and public key the site uses (see pages.yml).
      STATS_URL: ${{ vars.CHESSBOT_STATS_URL || 'https://vpqsrrhoqhoyjmndnltc.supabase.co' }}
      STATS_KEY: ${{ vars.CHESSBOT_STATS_KEY || 'sb_publishable_ORnp8JSnyWblH5jt_0-uqw_h7Hx-mhx' }}
    steps:
      - name: Ask the database for one game
        run: |
          auth=()
          # Legacy anon keys are JWTs and also go in Authorization.
          if [[ "$STATS_KEY" == eyJ* ]]; then auth=(-H "Authorization: Bearer $STATS_KEY"); fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -H "apikey: $STATS_KEY" "${auth[@]}" "$STATS_URL/rest/v1/games?select=id&limit=1"
          echo
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
