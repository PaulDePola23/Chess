name: Keep the site awake and check it

# Supabase pauses free projects after about a week without requests, which
# would switch off the Stats page, puzzle ratings and online games until the
# project is restored by hand. Every three days this reads a row from each
# table the site uses, which also checks that they are all set up.
# If the project has been paused anyway, the request fails and GitHub emails
# the repository owner about the failed run.
#
# It also fetches the live site's main files, the Stockfish engine and the
# Python runtime from jsDelivr, so a broken deploy or CDN also fails the run.
#
# GitHub also switches off scheduled workflows in public repositories that
# have had no commits for 60 days, so each run switches this one back on.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # The same project and public key the site uses (see pages.yml).
      STATS_URL: ${{ vars.CHESSBOT_STATS_URL || 'https://vpqsrrhoqhoyjmndnltc.supabase.co' }}
      STATS_KEY: ${{ vars.CHESSBOT_STATS_KEY || 'sb_publishable_ORnp8JSnyWblH5jt_0-uqw_h7Hx-mhx' }}
    steps:
      - name: Read a row from each table the site uses
        run: |
          auth=()
          # Legacy anon keys are JWTs and also go in Authorization.
          if [[ "$STATS_KEY" == eyJ* ]]; then auth=(-H "Authorization: Bearer $STATS_KEY"); fi
          for table in games puzzle_attempts live_games; do
            rows=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
              -H "apikey: $STATS_KEY" "${auth[@]}" "$STATS_URL/rest/v1/$table?select=id&limit=1")
            echo "$table: $rows"
          done
      - name: Check the live site and the files it loads
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # The Python runtime comes from jsDelivr; read its address from the live page.
          pyodide=$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$site/pyodide-backend.js" \
            | grep --only-matching --max-count=1 'https://cdn.jsdelivr.net/npm/pyodide@[^"]*')
          for url in "$site/" "$site/app.js" "$site/python.json" "$site/puzzles.json" \
            "$site/stockfish/stockfish-18-lite-single.js" "$site/stockfish/stockfish-18-lite-single.wasm" \
            "${pyodide}pyodide.mjs" "${pyodide}pyodide.asm.wasm"; do
            summary=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 60 \
              --output /dev/null --write-out "%{http_code} %{size_download} bytes %{content_type}" "$url")
            echo "$url: $summary"
          done
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
