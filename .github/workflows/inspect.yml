name: Inspect (temporary)

# A one-off, read-only check for debugging. Removed after use.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: What the CDN returns for the Stockfish files
        run: |
          for url in \
            https://cdn.jsdelivr.net/npm/stockfish@18.0.8/bin/stockfish-18-lite-single.js \
            https://cdn.jsdelivr.net/npm/stockfish@18.0.8/bin/stockfish-18-lite-single.wasm \
            https://cdn.jsdelivr.net/npm/pyodide@314.0.7/pyodide.mjs \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.js \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.wasm; do
            echo "== $url"
            curl --silent --show-error --location --output /tmp/body --write-out "status %{http_code}, %{size_download} bytes, %{content_type}\n" "$url"
            head -c 300 /tmp/body | tr -cd '[:print:]\n' | head -3
            echo
          done
